name: Manual v0.2 Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v prefix
        required: true
        default: "0.2.0"
        type: string
      publish_pypi:
        description: Publish dovewai-protocol to PyPI using trusted publishing
        required: true
        default: false
        type: boolean
      publish_npm:
        description: Publish @dovewai/protocol to npm using trusted publishing
        required: true
        default: false
        type: boolean
      create_github_release:
        description: Create/update GitHub vVERSION release and attach built packages
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: manual-v02-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight and package build
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "ERROR: releases must run from main"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify requested version matches package metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          version = os.environ["RELEASE_VERSION"]
          pyproject = pathlib.Path("sdk/python/pyproject.toml").read_text()
          match = re.search(r'^version = "([^"]+)"$', pyproject, re.MULTILINE)
          if not match or match.group(1) != version:
              raise SystemExit(f"Python package version does not match {version}")
          npm = json.loads(pathlib.Path("sdk/typescript/package.json").read_text())
          if npm.get("version") != version:
              raise SystemExit(f"npm package version does not match {version}")
          print(f"VALID: package versions agree on {version}")
          PY

      - name: Verify packaged Python schema equals canonical schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          canonical = json.loads(Path("schemas/v0.2/core.schema.json").read_text())
          packaged = json.loads(Path("sdk/python/src/dovewai_protocol/schema_v02.json").read_text())
          if canonical != packaged:
              raise SystemExit("packaged Python schema differs from canonical v0.2 schema")
          print("VALID: packaged schema is canonical")
          PY

      - name: Run protocol lifecycle and CLI TCK
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e sdk/python pytest build twine
          python -m pytest -q sdk/python/tests
          python tools/tck_v02.py
          for f in conformance/v0.2/valid/*.json; do python tools/lifecycle_validate_v02.py "$f"; done
          for f in conformance/v0.2/invalid/*.json; do
            if python tools/lifecycle_validate_v02.py "$f"; then
              echo "ERROR: invalid vector unexpectedly passed: $f"
              exit 1
            fi
          done

      - name: Build and verify Python distribution
        run: |
          cd sdk/python
          python -m build
          python -m twine check dist/*
          cd ../..
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("sdk/python/dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as zf:
              names = set(zf.namelist())
          if "dovewai_protocol/schema_v02.json" not in names:
              raise SystemExit("wheel does not contain packaged v0.2 schema")
          print("VALID: Python wheel contains schema")
          PY
          WHEEL=$(realpath sdk/python/dist/*.whl)
          BUNDLE=$(realpath examples/v0.2/verified-work-bundle.json)
          python -m venv /tmp/dovewai-release-wheel
          /tmp/dovewai-release-wheel/bin/python -m pip install "$WHEEL"
          cd /tmp
          /tmp/dovewai-release-wheel/bin/dovewai validate "$BUNDLE"

      - name: Build, test and pack TypeScript distribution
        working-directory: sdk/typescript
        run: |
          npm install --no-audit --no-fund
          npm test
          npm pack

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist-${{ inputs.version }}
          path: sdk/python/dist/*
          if-no-files-found: error

      - name: Upload npm package
        uses: actions/upload-artifact@v4
        with:
          name: npm-dist-${{ inputs.version }}
          path: sdk/typescript/*.tgz
          if-no-files-found: error

  publish-pypi:
    name: Publish Python package to PyPI
    if: inputs.publish_pypi
    needs: preflight
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dist-${{ inputs.version }}
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-npm:
    name: Publish TypeScript package to npm
    if: inputs.publish_npm
    needs: preflight
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download npm package
        uses: actions/download-artifact@v4
        with:
          name: npm-dist-${{ inputs.version }}
          path: dist

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install OIDC-capable npm
        run: npm install --global npm@latest

      - name: Publish to npm
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(find "$PWD/dist" -maxdepth 1 -type f -name '*.tgz' -print)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one npm package tarball, found ${#packages[@]}"
            printf '%s\n' "${packages[@]}"
            exit 1
          fi
          npm publish "${packages[0]}" --access public

  github-release:
    name: Create or update GitHub release
    if: inputs.create_github_release
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Python distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dist-${{ inputs.version }}
          path: release-assets/python

      - name: Download npm package
        uses: actions/download-artifact@v4
        with:
          name: npm-dist-${{ inputs.version }}
          path: release-assets/npm

      - name: Create or update GitHub tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<EOF
          DoveWAI Protocol v${RELEASE_VERSION}

          Public v0.2 release of the verifiable-work protocol, reference SDKs, CLI, lifecycle validator, TCK, conformance vectors, migration guide, and interoperability/adoption profiles.

          This release does not require private DoveWAI infrastructure. A WorkReceipt records execution and verification evidence; it is not automatic proof that every underlying claim is true.
          EOF

          if gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            gh release edit "v${RELEASE_VERSION}" \
              --title "DoveWAI Protocol v${RELEASE_VERSION}" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "v${RELEASE_VERSION}" \
              --target "${GITHUB_SHA}" \
              --title "DoveWAI Protocol v${RELEASE_VERSION}" \
              --notes-file /tmp/release-notes.md
          fi

          mapfile -t assets < <(find release-assets -type f \( -name '*.whl' -o -name '*.tar.gz' -o -name '*.tgz' \) -print)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "ERROR: no release package assets found"
            exit 1
          fi
          gh release upload "v${RELEASE_VERSION}" "${assets[@]}" --clobber
