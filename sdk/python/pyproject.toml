[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dovewai-protocol"
version = "0.2.0"
description = "Reference Python SDK and CLI for DoveWAI Protocol"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "DoveWAI" }]
dependencies = ["jsonschema[format]>=4.23,<5"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
dovewai = "dovewai_protocol.cli:main"

[project.urls]
Homepage = "https://github.com/DoveWAI/DoveWAI-Protocol"
Repository = "https://github.com/DoveWAI/DoveWAI-Protocol"
Issues = "https://github.com/DoveWAI/DoveWAI-Protocol/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dovewai_protocol"]
